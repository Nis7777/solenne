# Builds, signs (Apple cloud signing) and uploads to TestFlight.
# Start it from the GitHub app or website: Actions → TestFlight → Run workflow.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID      10-character Team ID (developer.apple.com → Membership)
#   ASC_KEY_ID         App Store Connect API key id
#   ASC_ISSUER_ID      App Store Connect API issuer id
#   ASC_KEY_P8         full text of the downloaded AuthKey_XXXX.p8 file
# and these repository variables:
#   BUNDLE_ID          the bundle id of the app record you created in App Store Connect
#   SUPABASE_URL       optional: turns on Claude stories + ElevenLabs voices (see deploy-backend.yml)
#   SUPABASE_ANON_KEY  optional: the project's anon public key
name: TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check configuration
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE: ${{ vars.BUNDLE_ID }}
        run: |
          missing=""
          [ -z "$TEAM" ] && missing="$missing APPLE_TEAM_ID"
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$P8" ] && missing="$missing ASC_KEY_P8"
          [ -z "$BUNDLE" ] && missing="$missing BUNDLE_ID(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Write API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Solenne.xcodeproj \
            -scheme Solenne \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Solenne.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PRODUCT_BUNDLE_IDENTIFIER="${{ vars.BUNDLE_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SOLENNE_SUPABASE_URL="${{ vars.SUPABASE_URL }}" \
            SOLENNE_SUPABASE_ANON_KEY="${{ vars.SUPABASE_ANON_KEY }}" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Solenne.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: "*.log"
