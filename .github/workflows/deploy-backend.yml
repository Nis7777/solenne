# Deploys the Supabase backend (database table, storage bucket, edge functions, API keys).
# Start it from the GitHub app or website: Actions → Deploy backend → Run workflow.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD    the database password you chose when creating the project
#   ANTHROPIC_API_KEY       console.anthropic.com → API Keys (writes the stories)
#   ELEVENLABS_API_KEY      elevenlabs.io → Developers → API Keys (narration + voice cloning)
# Repository variable:
#   SUPABASE_PROJECT_REF    the id in your project URL: https://supabase.com/dashboard/project/<this>
name: Deploy backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          [ -z "$ELEVENLABS_API_KEY" ] && missing="$missing ELEVENLABS_API_KEY"
          [ -z "$PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF(variable)"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Create table and storage bucket
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Store API keys as function secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: supabase secrets set --project-ref "$PROJECT_REF" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY"

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
